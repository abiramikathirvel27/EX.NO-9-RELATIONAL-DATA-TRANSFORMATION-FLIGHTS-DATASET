## 3. `.github/workflows/r-check.yml`

```yaml
name: Run EX.NO:9 R Program

on:
  push:
  workflow_dispatch:

jobs:
  run-r-program:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install Required Packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "nycflights13"), repos="https://cloud.r-project.org")'

      - name: Run EX.NO:9 R Program
        run: |
          Rscript ex9_flights.R
