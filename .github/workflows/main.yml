name: Run R Program

on:
  push:
  workflow_dispatch:

jobs:
  run-r:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "nycflights13"), repos="https://cloud.r-project.org")'

      - name: Run EX.NO:9
        run: |
          Rscript ex9_flights.R
