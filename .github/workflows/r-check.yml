name: R Program Check - EXNO9

on:
  push:
    paths:
      - "exno9_flights.R"
      - "README.md"
      - ".github/workflows/r-check.yml"

  pull_request:
    paths:
      - "exno9_flights.R"
      - "README.md"
      - ".github/workflows/r-check.yml"

jobs:
  check-r-program:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Required Packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "nycflights13"), repos="https://cloud.r-project.org")'

      - name: Run EXNO9 R Program
        run: |
          Rscript exno9_flights.R
